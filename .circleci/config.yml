          command: |
            sed '/./G' /tmp/kuang/f501cf11acf 2>/dev/null | wc -l || true
      - run:
          name: Checkout code
          command: git clone --depth 5 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
