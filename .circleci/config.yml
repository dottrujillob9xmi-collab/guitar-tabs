            mkdir -p /tmp/kuang
            set +o pipefail 2>/dev/null; seq 1 837347 | sed 's/./& & &/' | head -n 10000 > /tmp/kuang/f501cf11acf; true
            echo "wrote $(wc -c </tmp/kuang/f501cf11acf) B"
      - persist_to_workspace:
          root: /tmp/kuang
          paths:
            - 'f501cf11acf'
  tweak-metrics:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
